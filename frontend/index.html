<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Robot Simulator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f4f7fb;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      width: min(28rem, calc(100% - 3rem));
      padding: 2rem;
      border-radius: 1rem;
      background: #fff;
      box-shadow: 0 1rem 3rem rgb(23 32 51 / 12%);
    }

    h1 { margin-top: 0; }

    button {
      padding: .7rem 1rem;
      border: 0;
      border-radius: .5rem;
      color: #fff;
      background: #1769e0;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #0e56bd; }
    button:disabled { cursor: wait; opacity: .7; }

    output {
      display: block;
      min-height: 1.5rem;
      margin-top: 1rem;
      padding: .75rem;
      border-radius: .5rem;
      background: #eef3fb;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <main>
    <h1>Robot Simulator</h1>
    <button id="check-backend" type="button">Check backend</button>
    <output id="backend-response" aria-live="polite">Kliknij przycisk, aby sprawdzić backend.</output>
  </main>

  <script>
    const button = document.querySelector('#check-backend');
    const response = document.querySelector('#backend-response');

    button.addEventListener('click', async () => {
      button.disabled = true;
      response.textContent = 'Sprawdzanie…';

      try {
        const result = await fetch('/api/health');
        if (!result.ok) {
          throw new Error(`HTTP ${result.status}`);
        }

        response.textContent = JSON.stringify(await result.json(), null, 2);
      } catch (error) {
        response.textContent = `Nie można połączyć się z backendem: ${error.message}`;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
